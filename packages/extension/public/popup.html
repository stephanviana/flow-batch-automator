<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow Batch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Flow Batch</h1>
      <p>Fase 2 · Comunicação local</p>
      <p>
        Compare o código com a página local para autorizar esta extensão. Os
        testes abaixo são simulados e não usam o Google Flow.
      </p>
      <button data-action="connect" type="button">
        Conectar ao Flow Batch
      </button>
      <p id="code" class="code"></p>
      <button data-action="disconnect" type="button">Desconectar</button>
      <button data-action="reconnect" type="button">Reconectar</button>
      <button data-action="simulate" type="button" disabled>
        Enviar teste simulado (5 s)
      </button>
      <p id="status" role="status" aria-live="polite">
        Aguardando verificação.
      </p>
      <h2>Testes recentes</h2>
      <ul id="history"></ul>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
