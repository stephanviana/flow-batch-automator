name: flow-batch-automator

services:
  orchestrator:
    image: flow-batch-automator-orchestrator:0.6.0
    build:
      context: .
      target: orchestrator
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOST: 0.0.0.0
      PORT: 4319
      DATABASE_PATH: /data/flow-batch.sqlite
      LIBRARY_DIR: /library
      SQLITE_BUSY_TIMEOUT_MS: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:4319:4319'
    volumes:
      - sqlite_data:/data
      - type: bind
        source: ${FLOW_LIBRARY_DIR:?Defina FLOW_LIBRARY_DIR com a pasta local de instruções}
        target: /library
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }

volumes:
  sqlite_data:
