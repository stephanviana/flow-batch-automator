# Optional: expose only the creative library in a folder selected by the user.
# First create it with: pnpm library init /absolute/path
services:
  orchestrator:
    environment:
      LIBRARY_DIR: /library
    volumes:
      - type: bind
        source: ${FLOW_LIBRARY_DIR:?Defina FLOW_LIBRARY_DIR com uma biblioteca local existente}
        target: /library
        bind:
          create_host_path: false
